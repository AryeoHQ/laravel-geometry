# Tests aryeo/laravel-geometry and publishes it to the Artifactory Composer repository.
#
# aryeo/laravel-geometry is AryeoHQ's fork of spinen/laravel-geometry, kept for Laravel 13
# support (upstream supports up to Laravel 12). It replaces spinen/laravel-geometry, so
# requiring it satisfies packages that still require the upstream name.
#
# It is a plain PHPUnit package, not a Testbench one, so it runs only the tests and a
# composer.json check; the template's Pint, PHPStan and dependency-analysis jobs do not apply.
# Tag pipelines package the tagged source and publish it.
#
# The job scripts come from the shared template.
include:
  - project: vendor-platform/ci_cd/gitlab-ci-templates
    ref: main
    file: php-composer-package.yml

stages:
  - test
  - package
  - publish

# PHP 8.4, not the template's 8.5: phayes/geophp, a runtime dependency with no newer release,
# raises PHP 8.5 deprecations that fail the process-isolated tests.
variables:
  PHP_IMAGE: listing-and-vendor-management-docker.artifactory.zgtools.net/php-archetype/php:8.4.27-dev-bookworm-27

default:
  tags:
    - build
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# No composer.lock, so each leg resolves the newest dependencies for its Laravel version.
tests:
  stage: test
  extends: .php-tests
  variables:
    TEST_COMMAND: ./vendor/bin/phpunit
  parallel:
    matrix:
      - COMPOSER_REQUIRE: "illuminate/contracts:12.* illuminate/support:12.*"
      - COMPOSER_REQUIRE: "illuminate/contracts:13.* illuminate/support:13.*"

# Runs without installing dependencies. A job without rules is left out of merge request
# pipelines, so list every pipeline it should run in.
validate:
  stage: test
  image: $PHP_IMAGE
  script:
    - composer validate --no-check-lock
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

package:
  stage: package
  extends: .package
  needs: [tests, validate]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/

publish:
  stage: publish
  extends: .publish
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/
